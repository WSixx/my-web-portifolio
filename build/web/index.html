<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Portfólio de Lucas Gonçalves">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lucas Goncalves Portfólio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.ico"/>

  <title>Lucas Gonçalves Portfólio (Desativado)</title>
  <link rel="manifest" href="manifest.json">
</head>
<body id= "app-container">
  <style>
    .deactivated-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(90deg, #991b1b, #dc2626);
      color: #ffffff;
      padding: 12px 16px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .deactivated-banner a {
      color: #fef08a;
      text-decoration: underline;
      font-weight: 700;
    }
    .deactivated-banner a:hover {
      color: #ffffff;
    }
  </style>
  <div class="deactivated-banner" id="deactivated-banner">
    <span>⚠️ Este portfólio está desativado. Para informações atualizadas, acesse o meu</span>
    <a href="https://www.linkedin.com/in/lucasgo/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  </div>
  <script>
    function ensureBanner() {
      var banner = document.getElementById('deactivated-banner');
      if (banner && document.body && banner.parentNode !== document.body) {
        document.body.appendChild(banner);
      }
    }
    window.addEventListener('DOMContentLoaded', ensureBanner);
    window.addEventListener('load', ensureBanner);
    window.addEventListener('flutter-first-frame', ensureBanner);
    setInterval(ensureBanner, 1000);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('flutter-first-frame', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=1794178269');
      });
    }
  </script>
  <script src="main.dart.js" type="application/javascript"></script>
</body>
</html>
